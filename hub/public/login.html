<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Hub · 账号控制台</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard.css">
<style>
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:var(--font-sans,'Manrope',sans-serif);
  }
  .box{width:100%;max-width:400px}
  .mark{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:var(--accent);color:#fff;margin-bottom:20px;
  }
  h1{font-family:'Fraunces',serif;font-size:30px;font-weight:500;margin:0 0 6px;letter-spacing:-.02em}
  h1 em{font-style:italic;color:var(--accent)}
  .hint{font-size:13.5px;color:var(--muted);margin:0 0 26px}
  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
  .err{
    display:none;font-size:12.5px;padding:10px 13px;border-radius:8px;margin-bottom:14px;
    background:rgba(200,60,50,.09);color:var(--danger,#c2410c);
    border:1px solid rgba(200,60,50,.2);
  }
  .err.on{display:block}
  .foot{
    margin-top:26px;padding-top:18px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.8;
  }
</style>
</head>
<body class="bg-grain">
  <div class="box">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <h1>Grok <em>Hub</em></h1>
    <p class="hint">注册控制台。输入管理密码继续。</p>

    <div class="err" id="err"></div>

    <form id="f" autocomplete="off">
      <label for="pw">管理密码</label>
      <input class="input" type="password" id="pw" placeholder="••••••••" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit" id="go" style="width:100%;margin-top:16px;justify-content:center">
        进入控制台
      </button>
    </form>

    <div class="foot">
      会话有效期 12 小时 · 连续 6 次错误锁定 15 分钟<br>
      /v1/* 网关走 Bearer 令牌，不受此登录影响
    </div>
  </div>

<script>
  var f = document.getElementById('f');
  var err = document.getElementById('err');
  var go = document.getElementById('go');

  // 已登录直接进面板
  fetch('/api/auth/status').then(function(r){return r.json();}).then(function(d){
    if (d && d.authed) location.replace('/');
  }).catch(function(){});

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    err.classList.remove('on');
    go.disabled = true; go.textContent = '验证中…';
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: pw })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (x) {
      if (x.ok) { location.replace('/'); return; }
      err.textContent = (x.d && x.d.error && x.d.error.message) || '登录失败';
      err.classList.add('on');
      go.disabled = false; go.textContent = '进入控制台';
      document.getElementById('pw').select();
    }).catch(function (e2) {
      err.textContent = '网络错误：' + e2.message;
      err.classList.add('on');
      go.disabled = false; go.textContent = '进入控制台';
    });
  });
</script>
</body>
</html>
